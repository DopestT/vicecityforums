<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vice City Forums</title>
  <desc id="desc">GTA 6 news, guides, clips and community discussion</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090611"/>
      <stop offset=".52" stop-color="#1a0b2d"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b91"/>
      <stop offset=".5" stop-color="#a64dff"/>
      <stop offset="1" stop-color="#00e5ff"/>
